[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-affect-probe"
version = "1.0.0"
description = "Reproducible experiments for dynamic music affect modeling"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "numpy>=1.24",
  "pandas>=2.0",
  "librosa>=0.10.2",
  "soundfile>=0.12",
  "PyYAML>=6.0",
  "matplotlib>=3.7",
  "tqdm>=4.66",
]

[tool.setuptools.packages.find]
where = ["src"]
