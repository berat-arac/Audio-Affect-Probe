data:
  cache_dir: data/processed
  chunk_targets: 60
  chunk_hop_targets: 60
  min_chunk_targets: 20
model:
  kind: dual
  n_mels: 96
  hidden: 128
  dropout: 0.1
training:
  seed: 42
  epochs: 40
  batch_size: 4
  num_workers: 2
  lr: 0.0003
  weight_decay: 0.0001
  grad_clip: 1.0
  amp: true
  patience: 8
  gradient_accumulation_steps: 4
loss:
  ccc_weight: 1.0
  mse_weight: 0.2
output:
  root: results
  export_dir: exports
